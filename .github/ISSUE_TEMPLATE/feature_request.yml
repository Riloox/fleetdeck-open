name: Feature request
description: Suggest a new feature or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do that the panel cannot do today.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How you would expect it to work.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What you do today instead, if anything.
