# deploy/pi/fleetdeck-relay-tmpfiles.conf
#
# Install:
#   sudo install -o root -g root -m 0644 deploy/pi/fleetdeck-relay-tmpfiles.conf /etc/tmpfiles.d/fleetdeck-relay.conf
#   sudo systemd-tmpfiles --create /etc/tmpfiles.d/fleetdeck-relay.conf
#
# Creates the relay's private data directory (SQLite queue + backups) with the
# correct owner before the service starts. Nothing else is created here:
# /opt/fleetdeck-relay (code) is root-owned read-only and /etc/fleetdeck-relay
# (secrets) is root-only 0700.

# Type Path                      Mode User              Group             Age
d      /var/lib/fleetdeck-relay  0700 fleetdeck-relay   fleetdeck-relay   -
